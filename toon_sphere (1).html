<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toon Shaded Sphere</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1a1a1a; }
  canvas { display:block; }
  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    color:#888; font-family:sans-serif; font-size:13px; letter-spacing:0.5px;
    user-select:none;
  }
</style>
</head>
<body>
<div id="hint">drag to rotate • scroll to zoom</div>
<script>
  window.addEventListener('error', (e) => {
    const hint = document.getElementById('hint');
    hint.textContent = 'Error: ' + e.message;
    hint.style.color = '#ff6b6b';
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---- Scene setup ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 8;

// ---- Toon gradient map (4 discrete bands, like the reference image) ----
function buildGradientMap() {
  const steps = 4;
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) {
    data[i] = Math.floor((i / (steps - 1)) * 255);
  }
  const tex = new THREE.DataTexture(data, steps, 1, THREE.LuminanceFormat);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

// ---- Purple toon material ----
const toonMaterial = new THREE.MeshToonMaterial({
  color: 0x8a5cf0,
  gradientMap: buildGradientMap(),
});

const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
const sphere = new THREE.Mesh(sphereGeo, toonMaterial);
scene.add(sphere);

// ---- Black outline (classic toon/cel outline via backface expanded shell) ----
const outlineMaterial = new THREE.MeshBasicMaterial({
  color: 0x1a0e33,
  side: THREE.BackSide,
});
const outline = new THREE.Mesh(sphereGeo.clone(), outlineMaterial);
outline.scale.setScalar(1.045);
scene.add(outline);

// ---- Lighting ----
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(3, 4, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.25);
fillLight.position.set(-4, -1, -3);
scene.add(fillLight);

const ambient = new THREE.AmbientLight(0x402a66, 0.55);
scene.add(ambient);

// ---- Ground shadow-ish gradient plane (purely aesthetic, no real shadow) ----
const floorGeo = new THREE.CircleGeometry(2.4, 64);
const floorMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.35,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.3;
scene.add(floor);

// ---- Resize handling ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- Animate ----
function animate() {
  requestAnimationFrame(animate);
  sphere.rotation.y += 0.003;
  outline.rotation.y = sphere.rotation.y;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
