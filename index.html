<!DOCTYPE html>
<html>
<head>
    <title>3D Scene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            touch-action: none; /* stop mobile browser gestures from fighting OrbitControls / triggering chrome resize */
        }
        canvas {
            display: block;
        }

        /* ============ MESSAGE BUBBLE ============ */
        .message-bubble {
            position: fixed;
            /* Default fallback position — actually overridden per-button
               by showMessageBubble() via inline style, using
               BUBBLE_POSITIONS below. */
            left: 12vw;
            top: 22vh;

            max-width: 240px;
            background: rgba(20, 32, 60, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(47, 186, 255, 0.6);
            border-radius: 14px;
            padding: 12px 16px;
            color: #e8f2ff;
            font-family: "Science Gothic", sans-serif;
            font-size: 13.5px;
            line-height: 1.4;
            box-shadow: 0 0 20px rgba(47, 186, 255, 0.25);
            z-index: 20;

            transform: scale(0.85) translateY(12px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s ease, opacity 0.35s ease, left 0.35s ease, top 0.35s ease;
        }

        .message-bubble.visible {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* little speech-bubble tail pointing down toward the character */
        .message-bubble::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 30px;
            width: 14px;
            height: 14px;
            background: rgba(20, 32, 60, 0.55);
            border-right: 1px solid rgba(47, 186, 255, 0.6);
            border-bottom: 1px solid rgba(47, 186, 255, 0.6);
            transform: rotate(45deg);
        }

        .message-bubble-close {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: #9fb3d1;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

// ================== RESPONSIVE CAMERA FOV ==================
const BASE_VERTICAL_FOV_DEG = 75;
const BASE_REFERENCE_ASPECT = 16 / 9;

function updateResponsiveCameraFov() {
    const aspect = camera.aspect;
    const baseVFovRad = THREE.MathUtils.degToRad(BASE_VERTICAL_FOV_DEG);
    const lockedHFovRad = 2 * Math.atan(Math.tan(baseVFovRad / 2) * BASE_REFERENCE_ASPECT);
    const newVFovRad = 2 * Math.atan(Math.tan(lockedHFovRad / 2) / aspect);
    camera.fov = THREE.MathUtils.radToDeg(newVFovRad);
    camera.updateProjectionMatrix();
}

function updateCameraDistanceForAspect() {
    const aspect = camera.aspect;
    if (aspect >= 1) return;

    const pullBackFactor = THREE.MathUtils.clamp(1 / aspect, 1, 1.6);
    const target = controls.target;
    const dir = new THREE.Vector3().subVectors(camera.position, target);

    if (!updateCameraDistanceForAspect.baseDistance) {
        updateCameraDistanceForAspect.baseDistance = dir.length();
    }
    dir.normalize().multiplyScalar(updateCameraDistanceForAspect.baseDistance * pullBackFactor);
    camera.position.copy(target).add(dir);
}

// ================== RESIZE (debounced, chrome-toggle-aware) ==================
let lastWidth = window.innerWidth;
let lastHeight = window.innerHeight;
let resizeTimeout = null;

function applyResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const widthChanged = Math.abs(w - lastWidth) > 2;
    const heightChangedALot = Math.abs(h - lastHeight) > 120;

    if (!widthChanged && !heightChangedALot) return;

    lastWidth = w;
    lastHeight = h;

    camera.aspect = w / h;
    updateResponsiveCameraFov();
    updateCameraDistanceForAspect();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    depthRenderTarget.setSize(w, h);

    bloomPass.setSize(w * bloomResScale, h * bloomResScale);
}

window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(applyResize, 150);
});

window.addEventListener('orientationchange', () => {
    clearTimeout(resizeTimeout);
    setTimeout(applyResize, 200);
});

    scene.backgroundIntensity = 2.8;

Promise.all(objectLoadPromises).then(() => {
    let meshCount = 0;
    const materialTypeCounts = {};
    const unsupportedMeshes = [];

    scene.traverse((obj) => {
        if (!obj.isMesh) return;
        meshCount++;
        obj.castShadow = true;
        obj.receiveShadow = true;

        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((mat) => {
            if (!mat) return;
            const type = mat.type;
            materialTypeCounts[type] = (materialTypeCounts[type] || 0) + 1;

            const supportsReceivingShadows = [
                'MeshStandardMaterial',
                'MeshPhysicalMaterial',
                'MeshPhongMaterial',
                'MeshLambertMaterial',
                'MeshToonMaterial',
            ].includes(type);

            if (!supportsReceivingShadows) {
                unsupportedMeshes.push({ name: obj.name || '(unnamed)', materialType: type });
            }
        });
    });

    console.log(`Shadows enabled on ${meshCount} meshes.`);
    console.log('Material types in scene:', materialTypeCounts);
    if (unsupportedMeshes.length > 0) {
        console.warn(
            `${unsupportedMeshes.length} mesh(es) use a material that CANNOT receive shadows.`,
            unsupportedMeshes
        );
    }
});

    profile: "Anything other than getting a job! 😐",
    project: "Still in progress, had a phd in procrastination 🏃‍♂️🏃‍♂️",
    contact: "I see absolute darkness, quite similar to my future BTW 🙃",
};

// One screen position per button (vw/vh so it scales with the window).
// Since each button always flies the camera to the SAME fixed offset
// (see BUTTON_DESTINATIONS), these positions stay visually correct every
// time that tab opens. Tune each pair by eye once you can see all three.
const BUBBLE_POSITIONS = {
    profile: { left: '19vw', top: '12vh' },  // character visible on the left, panel on the right
    project: { left: '75vw', top: '18vh' },  // panel on the left, scene visible on the right
    contact: { left: '23vw', top: '58vh' },  // panel on the right, lower-left area free
};

const BUBBLE_POSITIONS_MOBILE = {
    profile: { left: '10vw', top: '12vh' },
    project: { left: '40vw', top: '65vh' },
    contact: { left: '15vw', top: '18vh' },
};
// ================== INTERACTIVE BUTTONS (single source of truth) ==================
setupInteractiveButtons(scene, camera, renderer, (buttonId) => {
    console.log('Button clicked:', buttonId);

    const destinations = isMobile ? BUTTON_DESTINATIONS_MOBILE : BUTTON_DESTINATIONS;
    const destination = destinations[buttonId];
    if (!destination) {
        console.warn(`No destination configured for button "${buttonId}"`);
        return;
    }

    const marker = cameraMarkers[destination.markerName];
    if (!marker) {
        console.warn(
            `Marker "${destination.markerName}" not found yet (still loading, or name mismatch).`
        );
        return;
    }

    const targetPos = new THREE.Vector3();
    const targetQuat = new THREE.Quaternion();
    marker.getWorldPosition(targetPos);
    marker.getWorldQuaternion(targetQuat);

    targetPos.x += destination.offsetPosition.x;
    targetPos.y += destination.offsetPosition.y;
    targetPos.z += destination.offsetPosition.z;

    const extraRotation = new THREE.Euler(
        THREE.MathUtils.degToRad(destination.offsetRotationDeg.x),
        THREE.MathUtils.degToRad(destination.offsetRotationDeg.y),
        THREE.MathUtils.degToRad(destination.offsetRotationDeg.z)
    );
    targetQuat.multiply(new THREE.Quaternion().setFromEuler(extraRotation));

    nav.flyToQuat(targetPos, targetQuat, 1.4, () => {
        sidePanel.show(destination.pageUrl, destination.panelSide, destination.mobileDock);

        const message = BUBBLE_MESSAGES[buttonId];
        const position = (isMobile ? BUBBLE_POSITIONS_MOBILE : BUBBLE_POSITIONS)[buttonId];
        if (message) {
            showMessageBubble(message, position);
        } else {
            hideMessageBubble();
        }
    });

});


// ================== MESSAGE BUBBLE (greeting near the character) ==================
function showMessageBubble(text, position) {
    const bubble = document.getElementById('messageBubble');
    if (!bubble) return;

    if (text) {
        const textEl = document.getElementById('messageBubbleText');
        if (textEl) textEl.textContent = text;
    }

    if (position) {
        bubble.style.left = position.left;
        bubble.style.top = position.top;
    }

    bubble.classList.add('visible');
}

function hideMessageBubble() {
    const bubble = document.getElementById('messageBubble');
    if (bubble) bubble.classList.remove('visible');
}

document.getElementById('messageBubbleClose')?.addEventListener('click', hideMessageBubble);


// ================== LOOP ==================
const clock = new THREE.Clock();
let totalTime = 0;

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    totalTime += delta;
    spaceRotatingText?.update(delta);
    if (nav.shouldUpdateControls()) {
        controls.update();
    }

    rockField.update(delta);

    const elapsed = clock.getElapsedTime();
    diskModel?.userData.updateAccretionDisk?.(elapsed);
    thurster?.userData.updateAccretionDisk?.(elapsed);

    composer.render();
}
animate();

</script>

  <p id="messageBubbleText">Hey, I'm Ravi 👋</p>
</div>
